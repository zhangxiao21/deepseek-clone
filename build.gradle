// 顶层构建：插件版本在 settings.gradle 的 pluginManagement 中声明。
// 不要在 build.gradle / allprojects 中声明仓库（FAIL_ON_PROJECT_REPOS 会报错）。
plugins {
    id 'com.android.application' apply false
    id 'org.jetbrains.kotlin.android' apply false
}

ext {
    compose_version = '1.2.1'
    compose_compiler_version = '1.3.2'   // 官方配对：compiler 1.3.2 ↔ Kotlin 1.7.20
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
